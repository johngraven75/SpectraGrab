name: .NET Core Desktop

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - 'Assets/**'
      - '.github/workflows/dotnet-desktop.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dotnet-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate HLS lifecycle and exact-output contracts
        shell: pwsh
        run: |
          $source = Get-Content Services/HlsYtdlpService.cs -Raw
          $required = @('after_move:SPECTRAGRAB_FILE:%(filepath)s', 'KillProcessTree(process)', 'ObserveAfterCancellationAsync', 'item.OutputPath = completedPath')
          $missing = @($required | Where-Object { -not $source.Contains($_) })
          if ($missing.Count -gt 0) { throw "HLS lifecycle contract is incomplete: $($missing -join ', ')" }

      - name: Restore
        run: dotnet restore SpectraGrab.csproj

      - name: Build
        run: dotnet build SpectraGrab.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish SpectraGrab.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'artifacts/win-x64/SpectraGrab.exe'
          if (-not (Test-Path $exe)) {
            throw "Published executable not found: $exe"
          }
          $file = Get-Item $exe
          if ($file.Length -le 0) {
            throw "Published executable is empty: $exe"
          }
          Write-Host "Verified $($file.FullName) ($($file.Length) bytes)"

      - name: Package Windows release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $archive = 'artifacts/SpectraGrab-Windows-x64.zip'
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path 'artifacts/win-x64/*' -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "Release archive was not created." }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SpectraGrab-Windows-x64-CI
          path: artifacts/win-x64/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v0.3.0-build-${{ github.run_number }}"
          $title = "SpectraGrab Windows v0.3.0 Build ${{ github.run_number }}"
          $archive = 'artifacts/SpectraGrab-Windows-x64.zip'
          $notes = "Automated Windows x64 v0.3.0 release from main. Includes process-tree-safe cancellation and exact completed-file tracking for native and FFmpeg-backed HLS downloads."
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $archive --clobber --repo "${{ github.repository }}"
            gh release edit $tag --target "${{ github.sha }}" --title $title --notes $notes --repo "${{ github.repository }}"
          } else {
            gh release create $tag $archive --target "${{ github.sha }}" --title $title --notes $notes --repo "${{ github.repository }}"
          }


      - name: Report build failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "SpectraGrab Windows build failure"
          $body = "Current-commit Windows build or publication failed.`n`nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`nCommit: ${{ github.sha }}"
          $existing = gh issue list --state open --search "`"$title`" in:title" --json number,title --jq ".[] | select(.title == `"$title`") | .number" | Select-Object -First 1
          if ($existing) {
            gh issue comment $existing --body $body
          } else {
            gh issue create --title $title --body $body
          }