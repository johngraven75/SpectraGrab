name: .NET Core Desktop

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - 'Assets/**'
      - '.github/workflows/dotnet-desktop.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dotnet-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SpectraGrab.csproj

      - name: Build
        run: dotnet build SpectraGrab.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish SpectraGrab.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'artifacts/win-x64/SpectraGrab.exe'
          if (-not (Test-Path $exe)) {
            throw "Published executable not found: $exe"
          }
          $file = Get-Item $exe
          if ($file.Length -le 0) {
            throw "Published executable is empty: $exe"
          }
          Write-Host "Verified $($file.FullName) ($($file.Length) bytes)"

      - name: Package Windows release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $archive = 'artifacts/SpectraGrab-Windows-x64.zip'
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path 'artifacts/win-x64/*' -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "Release archive was not created." }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGrab-Windows-x64-CI
          path: artifacts/win-x64/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          $title = "SpectraGrab Build ${{ github.run_number }}"
          $archive = 'artifacts/SpectraGrab-Windows-x64.zip'
          gh release create $tag $archive `
            --target "${{ github.sha }}" `
            --title $title `
            --notes "Automated Windows x64 release from main. Includes the JavaScript-capable Chromium headless-browser crawler hook with static HTTP fallback."
