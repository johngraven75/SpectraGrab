name: Windows Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version to release (must match FEATURE_PARITY.json)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: coordinated-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-publish-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate cross-platform release readiness
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/validate_cross_platform_release.py --version "$env:RELEASE_VERSION"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SpectraGrab.csproj

      - name: Build Release
        run: dotnet build SpectraGrab.csproj --configuration Release --no-restore

      - name: Publish Windows x64 self-contained
        shell: pwsh
        run: |
          dotnet publish SpectraGrab.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish/win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = 'publish/win-x64/SpectraGrab.exe'
          if (-not (Test-Path $exe)) {
            throw "Published executable not found: $exe"
          }
          $file = Get-Item $exe
          if ($file.Length -le 0) {
            throw "Published executable is empty: $exe"
          }
          Write-Host "Verified $($file.FullName) ($($file.Length) bytes)"

      - name: Package release bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $zip = "SpectraGrab-v$version-win-x64.zip"
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SpectraGrab-Windows-x64
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_ZIP }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          $zip = $env:RELEASE_ZIP
          $sha = "$zip.sha256"
          $title = "SpectraGrab Windows $tag"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            throw "Release $tag already exists; refusing to replace a coordinated release."
          }
          $notes = @"
          Automated Windows x64 release for SpectraGrab.

          - Configuration: Release
          - Runtime: win-x64
          - Deployment: self-contained
          - Packaging: single-file publish bundle
          - Product version: $env:RELEASE_VERSION
          - Commit: ${{ github.sha }}
          "@

          gh release create $tag $zip $sha `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title $title `
            --notes $notes